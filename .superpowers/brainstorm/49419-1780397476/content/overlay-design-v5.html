<h2>Trim overlay — refined type sizes</h2>
<p class="subtitle">Labels 12px, timecodes 14px</p>

<div class="mockup">
  <div class="mockup-header">Video area (IINA player)</div>
  <div class="mockup-body" style="background:#111;padding:0;position:relative;min-height:280px;">

    <div style="width:100%;height:200px;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);display:flex;align-items:center;justify-content:center;">
      <span style="color:#ffffff22;font-size:13px;letter-spacing:2px">VIDEO CONTENT</span>
    </div>

    <div style="
      background: rgba(18,18,18,0.97);
      backdrop-filter: blur(14px);
      padding: 14px 18px 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
    ">
      <div style="position:relative;height:36px;margin-bottom:12px;">
        <div style="position:absolute;top:14px;left:0;right:0;height:8px;border-radius:4px;background:rgba(255,255,255,0.10);"></div>
        <div style="position:absolute;top:14px;left:22%;right:38%;height:8px;border-radius:0;background:rgba(10,132,255,0.7);"></div>
        <div style="position:absolute;top:8px;left:22%;width:16px;height:20px;background:#0A84FF;border-radius:3px;transform:translateX(-50%);cursor:ew-resize;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(10,132,255,0.5);">
          <div style="width:2px;height:10px;background:rgba(255,255,255,0.5);border-radius:1px;"></div>
        </div>
        <div style="position:absolute;top:8px;right:38%;width:16px;height:20px;background:#0A84FF;border-radius:3px;transform:translateX(50%);cursor:ew-resize;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(10,132,255,0.5);">
          <div style="width:2px;height:10px;background:rgba(255,255,255,0.5);border-radius:1px;"></div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:12px;">
        <!-- Start -->
        <div style="display:flex;flex-direction:column;align-items:flex-start;min-width:80px;">
          <span style="color:rgba(255,255,255,0.5);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;font-weight:500;">Start</span>
          <span style="color:#0A84FF;font-size:14px;font-family:monospace;font-weight:700;">0:32.4</span>
        </div>

        <!-- Duration -->
        <div style="flex:1;text-align:center;color:rgba(255,255,255,0.4);font-size:12px;">
          Duration: <strong style="color:rgba(255,255,255,0.7);font-size:14px;font-family:monospace;">0:41.2</strong>
        </div>

        <!-- End -->
        <div style="display:flex;flex-direction:column;align-items:flex-end;min-width:80px;">
          <span style="color:rgba(255,255,255,0.5);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;font-weight:500;">End</span>
          <span style="color:#0A84FF;font-size:14px;font-family:monospace;font-weight:700;">1:13.6</span>
        </div>

        <div style="width:1px;height:32px;background:rgba(255,255,255,0.08);"></div>

        <button style="background:#0A84FF;color:#fff;border:none;border-radius:6px;padding:7px 18px;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:0.2px;box-shadow:0 2px 8px rgba(10,132,255,0.4);">Save</button>
        <button style="background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.10);border-radius:6px;padding:7px 12px;font-size:12px;cursor:pointer;">Cancel</button>
      </div>
    </div>
  </div>
</div>
